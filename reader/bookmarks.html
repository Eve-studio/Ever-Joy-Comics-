<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Your saved comic pages on Ever Joy Comics."
    >

    <title>Bookmarks | Ever Joy Comics</title>


    <!-- Global CSS -->

    <link
        rel="stylesheet"
        href="../css/global.css"
    >


    <!-- Reader CSS -->

    <link
        rel="stylesheet"
        href="../css/reader.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="reader-header">

        <button
            class="reader-header-btn"
            onclick="history.back()"
            aria-label="Go back"
        >

            ←

        </button>


        <div class="reader-title-area">

            <span class="reader-comic-title">

                Bookmarks

            </span>


            <span class="reader-chapter-title">

                Saved pages

            </span>

        </div>


        <button
            class="reader-header-btn"
            id="bookmarkRefreshButton"
            aria-label="Refresh bookmarks"
        >

            ↻

        </button>

    </header>



    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main
        class="bookmarks-page"
        id="bookmarksPage"
    >


        <!-- =================================================
             INTRO
             ================================================= -->

        <section class="bookmarks-intro">

            <h1>
                Your Bookmarks
            </h1>


            <p>
                Pages you've saved while reading.
            </p>

        </section>



        <!-- =================================================
             BOOKMARK COUNT
             ================================================= -->

        <div
            class="bookmarks-count"
            id="bookmarksCount"
        >

            0 saved pages

        </div>



        <!-- =================================================
             BOOKMARK LIST
             ================================================= -->

        <section
            class="bookmark-list"
            id="bookmarkList"
        >

            <!-- Bookmarks inserted by JavaScript -->

        </section>



        <!-- =================================================
             EMPTY STATE
             ================================================= -->

        <section
            class="bookmarks-empty"
            id="bookmarksEmpty"
            hidden
        >

            <div class="bookmarks-empty-icon">

                ♡

            </div>


            <h2>
                Nothing saved yet
            </h2>


            <p>
                Bookmark a page while reading and
                it will appear here.
            </p>


            <button
                class="bookmarks-back-btn"
                onclick="history.back()"
            >

                Back to Reading

            </button>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="../js/script.js"
    ></script>


    <script
        src="../js/bookmarks.js"
    ></script>


    <script
        src="../js/bookmarks-page.js"
    ></script>

</body>

</html>
