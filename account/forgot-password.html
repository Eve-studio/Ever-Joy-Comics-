<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Reset your Ever Joy Comics password."
>

<title>Forgot Password | Ever Joy Comics</title>


<!-- GLOBAL CSS -->

<link
    rel="stylesheet"
    href="../css/global.css"
>


<!-- ACCOUNT CSS -->

<link
    rel="stylesheet"
    href="../css/account.css"
>


<!-- FORGOT PASSWORD CSS -->

<link
    rel="stylesheet"
    href="../css/forgot-password.css"
>

</head><body class="account-body"><main class="auth-container">


    <!-- BRAND -->

    <section class="auth-brand">

        <a
            href="../index.html"
            class="auth-logo"
        >
            Ever Joy
        </a>

        <p class="auth-tagline">
            Stories worth keeping.
        </p>

    </section>


    <!-- FORGOT PASSWORD CARD -->

    <section class="auth-card">


        <div class="auth-heading">

            <span class="forgot-eyebrow">
                ACCOUNT RECOVERY
            </span>

            <h1>
                Forgot your password?
            </h1>

            <p>
                Enter the email connected to your
                Ever Joy account and create a new
                password.
            </p>

        </div>


        <!-- FORM -->

        <form
            id="forgotPasswordForm"
            class="auth-form"
            novalidate
        >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="forgotPasswordEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="forgotPasswordEmail"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label for="newPassword">
                    New password
                </label>

                <div class="password-field">

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Create a new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="toggleNewPassword"
                        aria-label="Show password"
                    >
                        Show
                    </button>

                </div>

                <small class="form-hint">
                    Use at least 8 characters.
                </small>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmNewPassword">
                    Confirm new password
                </label>

                <div class="password-field">

                    <input
                        type="password"
                        id="confirmNewPassword"
                        name="confirmNewPassword"
                        placeholder="Enter your new password again"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="toggleConfirmNewPassword"
                        aria-label="Show password"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- MESSAGE -->

            <div
                id="forgotPasswordMessage"
                class="auth-message"
                aria-live="polite"
                role="status"
            ></div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="auth-submit"
                id="forgotPasswordSubmit"
            >
                Reset Password
            </button>


        </form>


        <!-- LOGIN -->

        <div class="auth-switch">

            <span>
                Remember your password?
            </span>

            <a href="./login.html">
                Log in
            </a>

        </div>


        <!-- SIGN UP -->

        <div class="auth-switch">

            <span>
                Don't have an account?
            </span>

            <a href="./signup.html">
                Create an account
            </a>

        </div>


    </section>


    <!-- FOOTER -->

    <footer class="auth-footer">

        <span>
            © 2026 Ever Joy Comics
        </span>

    </footer>


</main>


<!-- GLOBAL JS -->

<script
    src="../js/script.js"
></script>


<!-- AUTH SYSTEM -->

<script
    src="../js/auth.js"
></script>


<!-- FORGOT PASSWORD JS -->

<script
    src="../js/forgot-password.js"
></script>

</body></html>
