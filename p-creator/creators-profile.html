<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Creator profile | Ever Joy Comics"
    >

    <title>Creator | Ever Joy Comics</title>


    <!-- GLOBAL CSS -->

    <link
        rel="stylesheet"
        href="../css/global.css"
    >


    <!-- CREATOR PROFILE CSS -->

    <link
        rel="stylesheet"
        href="../css/creator-profile.css"
    >

</head>


<body class="creator-profile-body">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="creator-profile-header">

        <button
            type="button"
            class="creator-back-button"
            id="creatorBackButton"
            aria-label="Go back"
        >
            ←
        </button>


        <div class="creator-header-title">
            Creator
        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main
        class="creator-profile-container"
        id="creatorProfile"
    >


        <!-- =================================================
             LOADING
        ================================================== -->

        <section
            class="creator-profile-loading"
            id="creatorProfileLoading"
        >

            <div class="creator-profile-loader"></div>

            <p>
                Loading creator...
            </p>

        </section>



        <!-- =================================================
             ERROR
        ================================================== -->

        <section
            class="creator-profile-error"
            id="creatorProfileError"
            hidden
        >

            <div class="creator-error-icon">
                !
            </div>

            <h2>
                Creator not found
            </h2>

            <p>
                This creator profile could not be found.
            </p>

            <a
                href="creators.html"
                class="creator-error-button"
            >
                Find Creators
            </a>

        </section>



        <!-- =================================================
             CREATOR IDENTITY
        ================================================== -->

        <section
            class="creator-identity"
            id="creatorIdentity"
            hidden
        >

            <div class="creator-avatar-wrapper">

                <img
                    src="../assets/images/default-avatar.webp"
                    alt="Creator profile picture"
                    class="creator-profile-avatar"
                    id="creatorProfileAvatar"
                >

            </div>


            <div class="creator-identity-info">

                <h1
                    id="creatorProfileName"
                >
                    Creator Name
                </h1>


                <p
                    class="creator-username"
                    id="creatorProfileUsername"
                >
                    @username
                </p>


                <div
                    class="creator-roles"
                    id="creatorProfileRoles"
                >
                    <!-- Roles generated by JS -->
                </div>

            </div>

        </section>



        <!-- =================================================
             BIO
        ================================================== -->

        <section
            class="creator-bio-section"
            id="creatorBioSection"
            hidden
        >

            <h2>
                About
            </h2>


            <p
                id="creatorProfileBio"
            >
                Creator bio
            </p>

        </section>



        <!-- =================================================
             CREATOR INFORMATION
        ================================================== -->

        <section
            class="creator-info-section"
            id="creatorInfoSection"
            hidden
        >

            <div class="creator-info-card">

                <span class="creator-info-label">
                    Creator
                </span>

                <strong
                    id="creatorProfileCreatorType"
                >
                    Creator
                </strong>

            </div>


            <div class="creator-info-card">

                <span class="creator-info-label">
                    Works
                </span>

                <strong
                    id="creatorProfileWorkCount"
                >
                    0
                </strong>

            </div>

        </section>



        <!-- =================================================
             WORKS
        ================================================== -->

        <section
            class="creator-works-section"
            id="creatorWorksSection"
            hidden
        >

            <div class="creator-section-heading">

                <h2>
                    Works
                </h2>

            </div>


            <div
                class="creator-works-grid"
                id="creatorWorksGrid"
            >

                <!-- Creator works generated by JS -->

            </div>

        </section>

    </main>



    <!-- =====================================================
         MOBILE BOTTOM NAVIGATION
    ====================================================== -->

    <nav
        class="bottom-nav"
        aria-label="Main navigation"
    >

        <a
            href="../index.html"
            class="bottom-nav-item"
        >

            <span>⌂</span>

            <small>
                Home
            </small>

        </a>


        <a
            href="../discover.html"
            class="bottom-nav-item"
        >

            <span>◉</span>

            <small>
                Discover
            </small>

        </a>


        <a
            href="creators.html"
            class="bottom-nav-item"
        >

            <span>♙</span>

            <small>
                Creators
            </small>

        </a>


        <a
            href="../reader/library.html"
            class="bottom-nav-item"
        >

            <span>▣</span>

            <small>
                Library
            </small>

        </a>


        <a
            href="../account/auth.html"
            class="bottom-nav-item"
        >

            <span>♙</span>

            <small>
                Profile
            </small>

        </a>

    </nav>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../js/script.js"></script>

    <script src="../js/comics.js"></script>

    <script src="../js/creator-profile.js"></script>

</body>

</html>
